<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת אגרונומית - יציב</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin:0; padding:0; height:100%; background:#111; }
        #map { height:100%; width:100%; }
        #crosshair { position:absolute; top:50%; left:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border:2px solid #00ffcc; border-radius:50%; z-index:1000; pointer-events:none; }
        .controls { position:absolute; top:10px; left:10px; z-index:1000; display:flex; gap:5px; }
        button { padding:10px; cursor:pointer; font-weight:bold; border-radius:5px; border:none; }
    </style>
</head>
<body>

<div class="controls">
    <button onclick="addPoint()">➕</button>
    <button onclick="undo()">↩️</button>
    <button onclick="savePlot()" style="background:#00ffcc;">💾 שמור</button>
    <button onclick="toggleTable()">📊 טבלה</button>
</div>

<div id="map"></div>
<div id="crosshair"></div>

<div id="modal" style="display:none; position:fixed; top:50px; left:10px; right:10px; bottom:10px; background:white; z-index:2000; padding:10px; overflow-y:auto;">
    <button onclick="toggleTable()">❌ סגור</button>
    <table style="width:100%; text-align:center;">
        <thead><tr><th>שם</th><th>זיתים</th><th>פעולה</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyA27yXtL-1oM78peHdi8RLxdG9PXosLe4Y", databaseURL: "https://olive-tree-2026-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var map = L.map('map').setView([31.7683, 35.2137], 15);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&hl=he&x={x}&y={y}&z={z}', { maxZoom: 22 }).addTo(map);

    var pts = [], poly = L.polyline([], {color: '#ffff00', weight: 4}).addTo(map);
    var drawnPolys = {};

    function addPoint() { pts.push([map.getCenter().lat, map.getCenter().lng]); poly.setLatLngs(pts); }
    function undo() { pts.pop(); poly.setLatLngs(pts); }
    
    function savePlot() {
        var name = prompt("שם חלקה:");
        if (!name) return;
        db.ref('plots').push({ name: name, points: pts, olive: 0 });
        pts = []; poly.setLatLngs([]);
    }

    // הקשבה לשינויים ב-Firebase
    db.ref('plots').on('value', snap => {
        var tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        snap.forEach(child => {
            var p = child.val();
            // ציור על המפה
            if (!drawnPolys[child.key]) {
                drawnPolys[child.key] = L.polygon(p.points, {color: '#00ffcc'}).addTo(map).bindPopup(p.name);
            }
            // הוספה לטבלה
            tbody.innerHTML += `<tr><td>${p.name}</td><td id="olive-${child.key}">${p.olive}</td>
                <td><button onclick="calcAI('${child.key}')">🤖 חישוב</button></td></tr>`;
        });
    });

    function calcAI(id) {
        var val = Math.floor(Math.random() * 100);
        db.ref('plots/' + id).update({ olive: val });
        document.getElementById('olive-' + id).innerText = val;
    }

    function toggleTable() { document.getElementById('modal').style.display = (document.getElementById('modal').style.display === 'none') ? 'block' : 'none'; }
</script>
</body>
</html>
